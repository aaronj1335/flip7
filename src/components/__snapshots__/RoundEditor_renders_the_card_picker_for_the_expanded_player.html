<div class="panel">
  <h2>Round 2</h2>
  <div class="hand-list">
    <div class="hand">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="false">
          <span class="hand-name">Ada</span
          ><span class="hand-empty"
            >Enter a score, or tap for the card pad</span
          ></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Ada round score"
          value="0"
        />
      </div>
    </div>
    <div class="hand flip7">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="true">
          <span class="hand-name">Grace</span
          ><span class="hand-cards"
            ><span class="chip">1</span><span class="chip">2</span
            ><span class="chip">3</span><span class="chip">4</span
            ><span class="chip">5</span><span class="chip">6</span
            ><span class="chip">7</span><span class="chip modifier">x2</span
            ><span class="chip flip7">FLIP 7</span></span
          ></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Grace round score"
          value="71"
        />
      </div>
      <div class="hand-editor">
        <h3>Number cards</h3>
        <div class="card-grid">
          <button type="button" class="card-button" aria-pressed="false">
            0</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            1</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            2</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            3</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            4</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            5</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            6</button
          ><button
            type="button"
            class="card-button selected"
            aria-pressed="true"
          >
            7</button
          ><button type="button" class="card-button" aria-pressed="false">
            8</button
          ><button type="button" class="card-button" aria-pressed="false">
            9</button
          ><button type="button" class="card-button" aria-pressed="false">
            10</button
          ><button type="button" class="card-button" aria-pressed="false">
            11</button
          ><button type="button" class="card-button" aria-pressed="false">
            12
          </button>
        </div>
        <h3>Modifiers &amp; bust</h3>
        <div class="card-grid">
          <button
            type="button"
            class="card-button modifier selected"
            aria-pressed="true"
          >
            x2</button
          ><button
            type="button"
            class="card-button modifier"
            aria-pressed="false"
          >
            +2</button
          ><button
            type="button"
            class="card-button modifier"
            aria-pressed="false"
          >
            +4</button
          ><button
            type="button"
            class="card-button modifier"
            aria-pressed="false"
          >
            +6</button
          ><button
            type="button"
            class="card-button modifier"
            aria-pressed="false"
          >
            +8</button
          ><button
            type="button"
            class="card-button modifier"
            aria-pressed="false"
          >
            +10</button
          ><button type="button" class="card-button bust" aria-pressed="false">
            Bust
          </button>
        </div>
        <div class="hand-editor-footer">
          <span>Round score 71 (includes the +15 Flip 7 bonus)</span
          ><button type="button">Clear</button>
        </div>
      </div>
    </div>
    <div class="hand">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="false">
          <span class="hand-name">Alan</span
          ><span class="hand-cards"><span class="chip">8</span></span></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Alan round score"
          value="8"
        />
      </div>
    </div>
  </div>
  <div class="button-row" style="margin-top: 0.9rem">
    <button type="button" class="button-primary">End round 2</button
    ><button type="button">Undo last round</button>
  </div>
</div>
