<div class="panel">
  <h2>Round 1</h2>
  <div class="hand-list">
    <div class="hand">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="false">
          <span class="hand-name">Ada</span
          ><span class="hand-cards"></span></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Ada round score"
          value="38"
        />
      </div>
    </div>
    <div class="hand">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="false">
          <span class="hand-name">Grace</span
          ><span class="hand-cards"></span></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Grace round score"
          value="0"
        />
      </div>
    </div>
    <div class="hand">
      <div class="hand-row">
        <button type="button" class="hand-summary" aria-expanded="false">
          <span class="hand-name">Alan</span
          ><span class="hand-cards"
            ><span class="chip">12</span
            ><span class="chip modifier">+4</span></span
          ></button
        ><input
          class="hand-points"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Alan round score"
          value="16"
        />
      </div>
    </div>
  </div>
  <div class="button-row" style="margin-top: 0.9rem">
    <button type="button" class="button-primary">End round 1</button
    ><button type="button">Undo last round</button>
  </div>
</div>
